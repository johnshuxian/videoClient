<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <!-- Capacitor 给 WebView 留出系统栏空间，状态栏显示应用窗口的底色。 -->
    <!-- 所有页面使用同一个入口；禁止双指缩放，保留正常滚动。 -->
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no" />
    <title>影窗 · 发现好电影</title>
    <style>
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #f4f6fc; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // 独立于模块脚本运行，电视 WebView 不支持模块或初始化卡住时也能给出提示。
      (function () {
        var root = document.getElementById("root");
        if (!("noModule" in document.createElement("script"))) {
          root.textContent = "影窗无法启动：电视的系统 WebView 版本过旧，请更新电视系统或 Android System WebView。";
          return;
        }
        window.addEventListener("error", function (event) {
          if (event.target === window && !root.querySelector(".app-shell")) {
            root.textContent = "影窗启动失败：" + event.message;
          }
        });
        window.setTimeout(function () {
          if (!root.querySelector(".app-shell")) {
            root.textContent = "影窗启动超时（" + (root.dataset.startupStep || "加载页面脚本") +
              "）。请重启应用；如果仍然出现，请更新电视系统或 Android System WebView，并反馈括号中的阶段。";
          }
        }, 20000);
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
