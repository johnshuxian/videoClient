<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1.0" />
    <title>影窗 · 发现好电影</title>
    <style>
      /* React 脚本加载前先显示本地内容，避免窗口出现一整块黑色。 */
      html, body, #root { min-height: 100%; margin: 0; }
      body { background: #edf3f7; }
      .startup-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 14px;
        color: #172b3c;
        font: 600 16px -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      .startup-mark {
        display: grid;
        place-items: center;
        width: 42px;
        height: 42px;
        border-radius: 12px;
        background: #d6bb8a;
        color: #071420;
        font-size: 22px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="startup-screen" role="status">
        <span class="startup-mark">▶</span>
        <span>影窗正在启动...</span>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
