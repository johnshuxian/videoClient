name: Encrypted tvOS diagnostic
on:
  push:
    branches: [codex/tvos-diagnostic-067]
    paths: [.github/workflows/tvos-encrypted-diagnostic.yml]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
        with:
          repository: johnshuxian/videoClient-source
          ref: dd7eb616af587337314027f1cc525a988d7fa562
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - name: Build and encrypt diagnostics
        shell: bash
        run: |
          if bash apple/Scripts/package-ipa.sh tvos > "$RUNNER_TEMP/tvos-build.log" 2>&1; then
            echo "tvOS archive succeeded"
            exit 0
          fi
          grep -i -E -B 2 -A 3 'error:|fatal error|archive failed|failed to|cannot find|could not' "$RUNNER_TEMP/tvos-build.log" | tail -n 180 > "$RUNNER_TEMP/diagnostic.txt" || true
          if [[ ! -s "$RUNNER_TEMP/diagnostic.txt" ]]; then
            tail -n 120 "$RUNNER_TEMP/tvos-build.log" > "$RUNNER_TEMP/diagnostic.txt"
          fi
          cat > "$RUNNER_TEMP/recipient.pem" <<'CERTIFICATE'
          -----BEGIN CERTIFICATE-----
          MIIDFTCCAf2gAwIBAgIUbtXWtV+GtfnSs9twzQUm/kKdCXswDQYJKoZIhvcNAQEL
          BQAwGjEYMBYGA1UEAwwPdHZPUyBkaWFnbm9zdGljMB4XDTI2MTEyODA5MDE0OFoX
          DTI2MTEzMDA5MDE0OFowGjEYMBYGA1UEAwwPdHZPUyBkaWFnbm9zdGljMIIBIjAN
          BgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAzV9XFDt+h1gge9xbPStGP5UQXYUf
          /SHN47oKOcwh5S8uwvCOCWw5b5MT7vqAYkaSUMnYYPA0vDmuJjxa0Ay1nYyjvsqr
          LGazBGHuzXw1nTCZlwOz7n2o//1N6kBOok0rgNF2rgb2orZmWWT46hYQiSS87b4J
          AfQIlZ2sIo/XzPFC1aAZqy5dmCvR11SAvDN62FELGP88n/ugMI+Mqw4aV648Fpw4
          XWsnacN/1rEM4BWzEv7qDrTfi1GnLBnceQPvw/3pFh82dfFVrxaqK91ET3/kjZtn
          b37mhJRuFLCVls5RiM32JjK7mz5gImoz7aWuqpcH7u91qHiFryHDQBIaCQIDAQAB
          o1MwUTAdBgNVHQ4EFgQUfdNkMo9aDWoby1XRPl+GFTGF8CwwHwYDVR0jBBgwFoAU
          fdNkMo9aDWoby1XRPl+GFTGF8CwwDwYDVR0TAQH/BAUwAwEB/zANBgkqhkiG9w0B
          AQsFAAOCAQEAPDZeq6Rh1nd1K68jz1SJqiDvXOxHfO0GuXBrYrziepba1pB1eTx+
          pUkyveNeO/ZMfi2Af5q1L3+HVN8Enm/0ZnAJ09lfQSTDTsUz7g1AAC6RH8MI4qm3
          TMVZrfw9csOwRBW1oT4YFxqQVL+5o/G8MDCpP/IedRLcfiW+evPoSyOlMNeDpKC0
          hDZJL+YKP343XiBkCOm5PiPgV7u3v2IOcWuBJBp7oqvzxDfhwyKuWSsIKEkhodz/
          6U1U6I3YhoOazGF8me2Rg8CH0dHxSQxFq7mqDH+xHsv0gAVV0WxnYm8IYvY/3411
          INpnFrkOs9jmI9ZOZOod0UPI1rzS36m9pA==
          -----END CERTIFICATE-----
          CERTIFICATE
          openssl cms -encrypt -binary -aes-256-cbc -in "$RUNNER_TEMP/diagnostic.txt" -out "$RUNNER_TEMP/diagnostic.der" -outform DER "$RUNNER_TEMP/recipient.pem"
          echo 'ENCRYPTED_DIAGNOSTIC_BEGIN'
          base64 < "$RUNNER_TEMP/diagnostic.der"
          echo 'ENCRYPTED_DIAGNOSTIC_END'
          exit 1
