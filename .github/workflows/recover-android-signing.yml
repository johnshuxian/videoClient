name: Recover Android signing secrets

# 只允许手动找回；输入的是本机公钥，私钥始终留在本机。
on:
  workflow_dispatch:
    inputs:
      recovery_public_key:
        description: Base64 public key from recover-android-signing.mjs prepare
        required: true
        type: string

permissions:
  contents: read

jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Test encrypted recovery
        run: node --test scripts/recover-android-signing.test.mjs

      # 仅打印加密密文，不上传 Artifact，不受 Artifact 存储配额影响。
      - name: Print encrypted recovery data
        env:
          ANDROID_RECOVERY_PUBLIC_KEY: ${{ inputs.recovery_public_key }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: node scripts/recover-android-signing.mjs encrypt -
