name: Build desktop installers

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            artifact: windows-x64
            installer: release/*.exe
          - os: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
            installer: release/*.dmg

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'

      - run: npm ci
      - run: npm test

      # The bundled AirPlay helper must be built on the same OS and CPU as the installer.
      - name: Package installer
        run: |
          npm run build:web
          npm run build:airplay
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.installer }}
          if-no-files-found: error
          retention-days: 14
