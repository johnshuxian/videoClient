name: Build and publish installers

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '源码版本标签，例如 v0.2.49'
        required: true
        type: string
      publish:
        description: '构建成功后发布安装包；关闭可只验证构建'
        default: true
        type: boolean

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  prepare:
    name: Verify source version
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate version tag
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::版本必须为 vX.Y.Z'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: johnshuxian/videoClient-source
          ref: ${{ env.RELEASE_TAG }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - name: Match package version and pin source commit
        id: source
        run: |
          node -e 'if ("v" + require("./package.json").version !== process.env.RELEASE_TAG) { console.error("版本标签与 package.json 不一致"); process.exit(1); }'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.artifact }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            artifact: windows-x64
            extension: exe
          - os: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
            extension: dmg
    steps:
      - uses: actions/checkout@v7
        with:
          repository: johnshuxian/videoClient-source
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      # 编译和测试错误可能包含源码片段，详细输出只保存在构建机临时目录，不上传为附件。
      - name: Install dependencies
        run: npm ci > "$RUNNER_TEMP/npm-ci.log" 2>&1
      - name: Test desktop app
        run: npm test > "$RUNNER_TEMP/desktop-tests.log" 2>&1
      - name: Build web resources
        run: npm run build:web > "$RUNNER_TEMP/web-build.log" 2>&1
      - name: Package installer
        run: npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish=never > "$RUNNER_TEMP/desktop-package.log" 2>&1
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Verify macOS ad-hoc signature
        if: matrix.platform == 'mac'
        run: |
          app="release/mac-arm64/影窗.app"
          codesign --verify --deep --strict "$app"
          signature=$(codesign --display --verbose=4 "$app" 2>&1)
          if [[ "$signature" != *"Signature=adhoc"* ]]; then
            echo '::error::macOS app is not ad-hoc signed'
            exit 1
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: videoClient-${{ env.RELEASE_TAG }}-${{ matrix.artifact }}
          path: release/videoClient-${{ env.RELEASE_TAG }}-${{ matrix.artifact }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 3

  build-android:
    name: android-apk
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          repository: johnshuxian/videoClient-source
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4
      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0" > "$RUNNER_TEMP/android-sdk.log" 2>&1
      - name: Install dependencies
        run: npm ci > "$RUNNER_TEMP/npm-ci.log" 2>&1
      - name: Build web resources
        run: npm run build:web > "$RUNNER_TEMP/web-build.log" 2>&1
      - name: Sync Android resources
        run: npx cap sync android > "$RUNNER_TEMP/android-sync.log" 2>&1
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo '::error::Android signing secrets are missing'
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/videoclient-release.jks"
          chmod 600 "$RUNNER_TEMP/videoclient-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/videoclient-release.jks" >> "$GITHUB_ENV"
      - name: Build signed Android APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease > "$RUNNER_TEMP/android-build.log" 2>&1
      - name: Test TV app
        working-directory: android-tv
        run: |
          chmod +x ./gradlew
          ./gradlew testDebugUnitTest > "$RUNNER_TEMP/tv-tests.log" 2>&1
      - name: Build signed TV APK
        working-directory: android-tv
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease > "$RUNNER_TEMP/tv-build.log" 2>&1
      - name: Verify Android and TV signatures
        run: |
          for apk in android/app/build/outputs/apk/release/app-release.apk android-tv/app/build/outputs/apk/release/app-release.apk; do
            certs=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs "$apk")
            if ! grep -Fqi '7f983ef32a1b69a84ed194797813e188c466ddbccee1a743890c6f36b558fed1' <<< "$certs"; then
              echo '::error::APK certificate does not match the release signing key'
              exit 1
            fi
          done
      - name: Prepare APK artifacts
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/videoClient-${RELEASE_TAG}-android.apk"
          cp android-tv/app/build/outputs/apk/release/app-release.apk "release/videoClient-${RELEASE_TAG}-android-tv.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: videoClient-${{ env.RELEASE_TAG }}-android
          path: release/videoClient-${{ env.RELEASE_TAG }}-android*.apk
          if-no-files-found: error
          retention-days: 3

  release:
    name: Publish GitHub release
    if: github.event_name != 'workflow_dispatch' || inputs.publish
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish installers
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          printf '影窗 %s\n\n提供 Windows x64、macOS ARM64、Android 和 Android TV 安装包。\n' "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          # 发布标签始终指向本公开仓库的提交，源码压缩包仅包含发布说明和工作流。
          gh release create "$RELEASE_TAG" \
            "release/videoClient-${RELEASE_TAG}-windows-x64.exe" \
            "release/videoClient-${RELEASE_TAG}-macos-arm64.dmg" \
            "release/videoClient-${RELEASE_TAG}-android.apk" \
            "release/videoClient-${RELEASE_TAG}-android-tv.apk" \
            --target "$GITHUB_SHA" --title "影窗 $RELEASE_TAG" --notes-file "$RUNNER_TEMP/release-notes.md"
