name: Build desktop installers and Android APK

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-2022
            platform: win
            arch: x64
            artifact: windows-x64
            extension: exe
          - os: macos-15
            platform: mac
            arch: arm64
            artifact: macos-arm64
            extension: dmg

    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test

      - name: Package installer
        run: |
          npm run build:web
          npx electron-builder --${{ matrix.platform }} --${{ matrix.arch }} --publish=never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Verify macOS ad-hoc signature
        if: matrix.platform == 'mac'
        shell: bash
        run: |
          app="release/mac-arm64/影窗.app"
          # 同时验证嵌套代码，避免发布漏签或签名损坏的应用。
          codesign --verify --deep --strict --verbose=2 "$app"
          signature=$(codesign --display --verbose=4 "$app" 2>&1)
          printf '%s\n' "$signature"
          if [[ "$signature" != *"Signature=adhoc"* ]]; then
            echo "::error::macOS app is not ad-hoc signed"
            exit 1
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: videoClient-${{ github.ref_name }}-${{ matrix.artifact }}
          path: release/videoClient-${{ github.ref_name }}-${{ matrix.artifact }}.${{ matrix.extension }}
          if-no-files-found: error
          retention-days: 14

  build-android:
    name: android-apk
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        run: sdkmanager "platforms;android-36" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run build:web
      - run: npx cap sync android
      - name: Restore Android signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          if [[ -z "$ANDROID_KEYSTORE_BASE64" || -z "$ANDROID_KEYSTORE_PASSWORD" ]]; then
            echo "::error::Android signing secrets are missing"
            exit 1
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/videoclient-release.jks"
          chmod 600 "$RUNNER_TEMP/videoclient-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/videoclient-release.jks" >> "$GITHUB_ENV"
      - name: Build signed release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: ./gradlew assembleRelease
      - name: Verify APK signature
        run: |
          # Pin the certificate so a replaced secret cannot silently change future APK signatures.
          certs=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android/app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          if ! grep -Fqi '7f983ef32a1b69a84ed194797813e188c466ddbccee1a743890c6f36b558fed1' <<< "$certs"; then
            echo "::error::APK certificate does not match the release signing key"
            exit 1
          fi
      - name: Prepare APK artifact
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/release/app-release.apk "release/videoClient-${GITHUB_REF_NAME}-android.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: videoClient-${{ github.ref_name }}-android
          path: release/videoClient-${{ github.ref_name }}-android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Build signed native TV APK
        working-directory: android-tv
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease
      - name: Verify TV APK signature
        run: |
          certs=$("$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --print-certs android-tv/app/build/outputs/apk/release/app-release.apk)
          echo "$certs"
          if ! grep -Fqi '7f983ef32a1b69a84ed194797813e188c466ddbccee1a743890c6f36b558fed1' <<< "$certs"; then
            echo "::error::TV APK certificate does not match the release signing key"
            exit 1
          fi
      - name: Prepare TV APK artifact
        run: cp android-tv/app/build/outputs/apk/release/app-release.apk "release/videoClient-${GITHUB_REF_NAME}-android-tv.apk"
      - uses: actions/upload-artifact@v7
        with:
          name: videoClient-${{ github.ref_name }}-android-tv
          path: release/videoClient-${{ github.ref_name }}-android-tv.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: release
          merge-multiple: true
      - name: Publish installers
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "release/videoClient-${GITHUB_REF_NAME}-windows-x64.exe" \
            "release/videoClient-${GITHUB_REF_NAME}-macos-arm64.dmg" \
            "release/videoClient-${GITHUB_REF_NAME}-android.apk" \
            "release/videoClient-${GITHUB_REF_NAME}-android-tv.apk" \
            --verify-tag --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
