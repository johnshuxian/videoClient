name: Build iOS and Apple TV

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: '源码版本标签，例如 v0.2.60'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: apple-build-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ inputs.version || github.ref_name }}

jobs:
  prepare:
    name: Verify source version
    runs-on: ubuntu-latest
    outputs:
      source_sha: ${{ steps.source.outputs.sha }}
    steps:
      - name: Validate version tag
        shell: bash
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo '::error::版本必须为 vX.Y.Z'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          repository: johnshuxian/videoClient-source
          ref: ${{ env.RELEASE_TAG }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - name: Match package version and pin source commit
        id: source
        shell: bash
        run: |
          node -e 'if ("v" + require("./package.json").version !== process.env.RELEASE_TAG) { console.error("版本标签与 package.json 不一致"); process.exit(1); }'
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.platform }} IPA
    needs: prepare
    runs-on: macos-26
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: ios
            artifact: iOS
          - platform: tvos
            artifact: tvOS
    steps:
      - uses: actions/checkout@v7
        with:
          repository: johnshuxian/videoClient-source
          ref: ${{ needs.prepare.outputs.source_sha }}
          ssh-key: ${{ secrets.SOURCE_SSH_KEY }}
          persist-credentials: false
      - name: Check Xcode and platform SDKs
        shell: bash
        run: |
          xcodebuild -version
          xcodebuild -showsdks
      # 构建日志可能包含私有源码，只留在构建机临时目录。
      - name: Test shared Swift package
        if: matrix.platform == 'ios'
        shell: bash
        run: swift test --package-path apple/Packages/VideoCore > "$RUNNER_TEMP/apple-tests.log" 2>&1
      - name: Build unsigned IPA
        shell: bash
        run: bash apple/Scripts/package-ipa.sh "${{ matrix.platform }}" > "$RUNNER_TEMP/apple-build.log" 2>&1
      - uses: actions/upload-artifact@v7
        with:
          path: apple/Release/YingChuang-${{ matrix.artifact }}-*-unsigned.ipa
          archive: false
          if-no-files-found: error
          retention-days: 3

